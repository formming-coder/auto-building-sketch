<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Building Sketch V2.15</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#263238;background:#f4f5f6;--ks-yellow:#f4c400;--ks-gold:#d8a900;--ks-gray:#374151;--ks-light:#fff8d9}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1280px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:15px;box-shadow:0 2px 8px #00000008}
h1,h2,h3{margin:0 0 8px}.muted{color:#6b7280;font-size:13px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.stack{display:grid;gap:10px}
.floor{border:1px solid #ddd;border-radius:12px;padding:11px}.item{border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin-top:8px;background:#fff}
label{font-size:13px;display:block}input,select{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:9px;margin-top:4px;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:1px solid #cfd3d8;background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.primary{background:var(--ks-gray);color:#fff;border-color:var(--ks-gray)}
.typeBtns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px} .extensionRow{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.typeBtns .btn{font-size:13px}
.planbox{background:#fff;border:1px solid #ddd;border-radius:16px;padding:10px;overflow:hidden}
.plan-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.plans-sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}.planbox{min-width:0}.plan-svg{width:100%;display:block;background:#fff;border-radius:10px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border:1px solid #e5e7eb;border-radius:10px;padding:12px}.num{font-size:22px;font-weight:700}
table th,table td{border:1px solid #e5e7eb;padding:8px;text-align:right;white-space:nowrap}table th:first-child,table td:first-child{text-align:left}table thead th{background:#f9fafb}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.notice{padding:10px;border-radius:9px;background:#f0fdf4;border:1px solid #bbf7d0;font-size:13px;display:none}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.legend span{font-size:12px;padding:5px 8px;border-radius:99px;border:1px solid #ddd}
.dragging{cursor:grabbing!important;opacity:.82}.drag-box{touch-action:pan-y}
.move-toolbar{position:fixed;z-index:9999;display:none;gap:5px;align-items:center;padding:6px;background:#111827;color:#fff;border-radius:12px;box-shadow:0 8px 24px #0003}
.move-toolbar button{width:36px;height:36px;border:0;border-radius:9px;background:#374151;color:#fff;font-size:18px}.move-toolbar .move-label{font-size:11px;padding:0 4px;white-space:nowrap}@media(max-width:850px){.wrap{padding:8px}.card{border-radius:14px;padding:12px}.grid{gap:10px}.plans-sheet{grid-template-columns:repeat(2,minmax(260px,1fr));overflow-x:auto;padding-bottom:6px}.planbox{padding:6px}.plan-svg{width:100%;height:auto}.actions{gap:6px}.actions .btn{flex:1 1 auto}}
@media(max-width:850px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.wrap{padding:10px}}
@media print{.grid{grid-template-columns:1fr}.card:first-child{display:none}.plan-svg{min-width:0}.planbox{border:0;box-shadow:none}}

.plans-sheet{
  width:100%;
  max-width:794px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  padding:12px;
  background:#f3f4f6;
  border:1px solid #e5e7eb;
  border-radius:14px;
  box-sizing:border-box;
}
.plans-sheet .planbox{min-width:0;background:#fff}
@media(max-width:520px){
  .plans-sheet{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:7px}
  .plans-sheet .planbox{padding:5px;border-radius:8px}
  .plans-sheet .plan-title{font-size:11px}
  .plans-sheet .plan-svg{min-width:0;width:100%}
}

/* V2.5: resize handles + smoother mobile interaction */
.plan-svg{touch-action:pan-y;overscroll-behavior:contain}
.drag-box{touch-action:pan-y}
.resize-handle{fill:#fff;stroke:#111827;stroke-width:1.5;cursor:nwse-resize}
.resize-handle.ne{cursor:nesw-resize}.resize-handle.sw{cursor:nesw-resize}.resize-handle.se{cursor:nwse-resize}
@media(max-width:850px){
  body{overscroll-behavior-y:none}
  .plan-svg{touch-action:pan-y}
  .resize-handle{r:7}
}
</style>
</head>
<body style="overscroll-behavior-y:auto;-webkit-overflow-scrolling:touch;">
<div class="wrap">
  <div class="row" style="margin-bottom:14px">
    <div><div style="display:flex;align-items:center;gap:10px"><span style="width:10px;height:34px;border-radius:4px;background:var(--ks-yellow);display:inline-block"></span><div><h1 style="margin:0">Auto Building Sketch</h1></div></div></div>
  </div>

  <div class="grid">
    <section class="card">
      <h2>ข้อมูลทรัพย์</h2>
      <div class="stack">
        <label>ประเภททรัพย์
          <select id="propertyType">
            <option value="บ้านเดี่ยว">บ้านเดี่ยว</option><option value="บ้านแฝด">บ้านแฝด</option><option value="ทาวน์เฮ้าส์">ทาวน์เฮ้าส์</option>
            <option value="อาคารพาณิชย์">อาคารพาณิชย์</option><option value="อาคารสำนักงาน">อาคารสำนักงาน</option><option value="โรงงาน">โรงงาน</option><option value="โกดัง">โกดัง</option><option value="อื่น ๆ">อื่น ๆ</option>
          </select>
        </label>
        <div id="otherTypeWrap" style="display:none;margin-top:8px">
  <label>รายละเอียดประเภททรัพย์
    <input id="otherType" type="text" placeholder="ระบุรายละเอียดประเภททรัพย์">
  </label>
</div>
<div style="margin-top:8px"><label>CIF<input id="cif" type="text" inputmode="numeric" placeholder="กรอก CIF"></label></div>
      </div>
      <div class="actions"><button class="btn primary" id="save">บันทึกทรัพย์</button><button class="btn" id="load">🔍 ค้นหา CIF</button><button class="btn" id="clear">เริ่มใหม่</button></div>
<div id="cifSearchPanel" class="card" style="display:none;margin-top:10px;padding:12px;background:#fafafa">
  <div class="row" style="margin-bottom:8px"><strong>เปิดงานเดิมจาก CIF</strong><button class="btn" id="closeCifSearch">ปิด</button></div>
  <input id="cifSearch" type="text" inputmode="numeric" placeholder="กรอก CIF ที่เคยบันทึก">
  <div id="cifResults" style="margin-top:8px"></div>
</div>
      <div id="notice" class="notice"></div><div id="propertyLabel" class="muted" style="margin-top:8px"></div>
      <hr style="border:0;border-top:1px solid #eee;margin:15px 0">

      <div class="row"><h2>ข้อมูลสำรวจ</h2><button class="btn" id="addFloor">+ ชั้น</button></div>
      <div id="editor" class="stack"></div>

      <div class="typeBtns">
        <button class="btn" data-add-type="พื้นที่หลัก">+ อาคารหลัก</button>
        <button class="btn" id="addExtension">+ ส่วนต่อเติม</button>
<div id="extensionChooser" style="display:none;margin-top:7px">
  <select id="extensionSide" class="btn" style="width:100%;margin:0">
    <option value="หลัง">ด้านหลัง</option>
    <option value="หน้า">ด้านหน้า</option>
    <option value="ซ้าย">ด้านซ้าย</option>
    <option value="ขวา">ด้านขวา</option>
  </select>
  <button class="btn primary" id="confirmExtension" style="width:100%;margin-top:6px">เพิ่มส่วนต่อเติม</button>
</div>
        <button class="btn" data-add-type="ที่จอดรถ">+ ที่จอดรถ</button>
        <button class="btn" data-add-type="เฉลียง">+ เฉลียง</button>
        <button class="btn" data-add-type="ระเบียง">+ ระเบียง</button>
        <button class="btn" data-add-type="อื่น ๆ">+ อื่น ๆ</button>
      </div>

      <button class="btn primary" style="width:100%;margin-top:10px" id="generate">จัดผังอัตโนมัติ</button>
      <button class="btn" style="width:100%;margin-top:8px" id="resetLayout">↺ จัดผังใหม่</button>

      <hr style="border:0;border-top:1px solid #eee;margin:15px 0">
      <h3>Export</h3><div class="muted">ส่งออกตามรูปแบบกระดาษ A4 แนวตั้ง</div><div class="actions"><button class="btn primary" id="exportImage">Export รูปภาพ (PNG)</button><button class="btn primary" id="exportPDF">Export PDF</button></div>
    </section>

    <section class="stack">
      <div class="card">
        <div class="row"><h2>ผังสิ่งปลูกสร้าง</h2><strong id="grand">0.00 ตร.ม.</strong></div>
        <div class="legend">
          <span style="background:#fce7f3">อาคารหลัก</span><span style="background:#dcfce7">ส่วนต่อเติม</span><span style="background:#fef3c7">ที่จอดรถ</span><span style="background:#dbeafe">ระเบียง</span><span style="background:#ffedd5">เฉลียง</span><span style="background:#f3e8ff">อื่น ๆ</span>
        </div>
      </div>
      <div id="plans" class="plans-sheet"></div>
      <div class="card"><h2>สรุปพื้นที่</h2><div id="summary" class="summary"></div>
        <div style="overflow:auto;margin-top:14px"><table id="areaTable" style="width:100%;border-collapse:collapse;font-size:13px"><thead></thead><tbody></tbody></table></div>
      </div>
    </section>
  </div>
</div>

<div id="moveToolbar" class="move-toolbar">
  <span class="move-label">เลื่อนกล่อง</span>
  <button data-nudge="up">↑</button><button data-nudge="left">←</button><button data-nudge="down">↓</button><button data-nudge="right">→</button>
  <button data-nudge="center">●</button>
</div>
<script>
const TYPES=['พื้นที่หลัก','ส่วนต่อเติม','ที่จอดรถ','ระเบียง','เฉลียง','อื่น ๆ'];
const COLORS={'พื้นที่หลัก':'#fce7f3','ส่วนต่อเติม':'#dcfce7','ที่จอดรถ':'#fef3c7','ระเบียง':'#dbeafe','เฉลียง':'#ffedd5','อื่น ๆ':'#f3e8ff'};
const STROKES={'พื้นที่หลัก':'#db2777','ส่วนต่อเติม':'#16a34a','ที่จอดรถ':'#d97706','ระเบียง':'#2563eb','เฉลียง':'#ea580c','อื่น ๆ':'#9333ea'};
let floors=[
 {name:'แปลนชั้น 1',items:[
  {type:'พื้นที่หลัก',name:'',w:5,d:7}
 ]}
];
const $=id=>document.getElementById(id), area=x=>(Number(x.w)||0)*(Number(x.d)||0);
function getPropertyType(){const v=$('propertyType').value;return v==='อื่น ๆ'?($('otherType').value.trim()||'อื่น ๆ'):v}
$('propertyType').addEventListener('change',()=>{
 const isOther=$('propertyType').value==='อื่น ๆ';
 $('otherTypeWrap').style.display=isOther?'block':'none';
 if(isOther) setTimeout(()=>$('otherType')?.focus(),50);
});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function renderEditor(){
 $('editor').innerHTML='';
 floors.forEach((f,fi)=>{
  const div=document.createElement('div');div.className='floor';
  div.innerHTML=`<div class="row"><strong>${esc(f.name)}</strong>${fi?`<button class="btn" data-act="removeFloor" data-fi="${fi}">ลบชั้น</button>`:''}</div>`;
  f.items.forEach((x,ii)=>{
   const item=document.createElement('div');item.className='item';
   const direction = x.type==='ส่วนต่อเติม' ? `
   <label>ตำแหน่งส่วนต่อเติม
    <select data-k="side" data-fi="${fi}" data-ii="${ii}">
      ${['ด้านหลัง','ด้านหน้า','ด้านซ้าย','ด้านขวา'].map(v=>`<option ${v===((x.side||x.position)||'ด้านหลัง')?'selected':''}>${v}</option>`).join('')}
    </select>
   </label>` : '';
   item.innerHTML=`<div class="row"><strong>${x.type==='พื้นที่หลัก'?'อาคารหลัก':x.type}</strong><button class="btn" data-act="removeItem" data-fi="${fi}" data-ii="${ii}">ลบ</button></div>
   ${direction}
   <div class="two"><label>กว้าง (ม.)<input type="number" step="0.1" min="0.1" data-k="w" data-fi="${fi}" data-ii="${ii}" value="${x.w}"></label>
   <label>ลึก (ม.)<input type="number" step="0.1" min="0.1" data-k="d" data-fi="${fi}" data-ii="${ii}" value="${x.d}"></label></div>
    ${x.type==='ส่วนต่อเติม'?`<label style="margin-top:8px">ชื่อส่วนต่อเติม (ไม่บังคับ)<input type="text" data-k="name" data-fi="${fi}" data-ii="${ii}" value="${esc(x.name||'')}" placeholder="เช่น ครัว, ห้องเก็บของ"></label>`:''}
    <div class="muted" style="margin-top:6px;font-weight:600">${x.w} × ${x.d} = ${area(x).toFixed(2)} ตร.ม.</div>`;
   div.appendChild(item);
  });
  $('editor').appendChild(div);
 });
}
function normalizeSide(v){
  const s=String(v||'').trim();
  if(s==='ด้านหลัง'||s==='หลัง') return 'หลัง';
  if(s==='ด้านหน้า'||s==='หน้า') return 'หน้า';
  if(s==='ด้านซ้าย'||s==='ซ้าย') return 'ซ้าย';
  if(s==='ด้านขวา'||s==='ขวา') return 'ขวา';
  return 'หลัง';
}
function autoLayout(f){
  const main=f.items.find(x=>x.type==='พื้นที่หลัก');
  if(!main)return;
  main.ox=0;main.oy=0;

  // Keep the exact order in which the officer added each item.
  const backs=f.items.filter(x=>x.type==='ส่วนต่อเติม' && normalizeSide(x.side||x.position)==='หลัง');
  let rear=-main.d/2;
  backs.forEach(x=>{x.ox=0;x.oy=rear-x.d/2;rear-=x.d});

  const fronts=f.items.filter(x=>x.type==='ส่วนต่อเติม' && normalizeSide(x.side||x.position)==='หน้า');
  let front=main.d/2;
  fronts.forEach(x=>{x.ox=0;x.oy=front+x.d/2;front+=x.d});

  const lefts=f.items.filter(x=>x.type==='ส่วนต่อเติม' && normalizeSide(x.side||x.position)==='ซ้าย');
  let left=-main.w/2;
  lefts.forEach(x=>{x.ox=left-x.w/2;x.oy=0;left-=x.w});

  const rights=f.items.filter(x=>x.type==='ส่วนต่อเติม' && normalizeSide(x.side||x.position)==='ขวา');
  let right=main.w/2;
  rights.forEach(x=>{x.ox=right+x.w/2;x.oy=0;right+=x.w});

  // Parking is attached to the front of the main building, facing the road.
  const parks=f.items.filter(x=>x.type==='ที่จอดรถ');
  let parkX=-(parks.reduce((s,x)=>s+x.w,0))/2;
  parks.forEach(x=>{
    x.ox=parkX+x.w/2;
    x.oy=main.d/2+x.d/2;
    parkX+=x.w;
  });

  // Veranda / balcony: keep added order and attach to the front.
  const frontExtras=f.items.filter(x=>x.type==='เฉลียง'||x.type==='ระเบียง');
  let extraX=-(frontExtras.reduce((s,x)=>s+x.w,0))/2;
  frontExtras.forEach(x=>{
    x.ox=extraX+x.w/2;
    x.oy=main.d/2+x.d/2;
    extraX+=x.w;
  });

  f.items.filter(x=>x.type==='อื่น ๆ').forEach((x,i)=>{
    x.ox=main.w/2+x.w/2;
    x.oy=main.d/2+x.d/2+i*(x.d+0.01);
  });
}
function geom(f){
 const scale=48, main=f.items.find(x=>x.type==='พื้นที่หลัก')||{w:5,d:5};
 const all=f.items; let minX=-main.w/2,maxX=main.w/2,minY=-main.d/2,maxY=main.d/2;
 all.forEach(x=>{const ox=Number(x.ox)||0,oy=Number(x.oy)||0;minX=Math.min(minX,ox-x.w/2);maxX=Math.max(maxX,ox+x.w/2);minY=Math.min(minY,oy-x.d/2);maxY=Math.max(maxY,oy+x.d/2)});
 return {scale,minX,maxX,minY,maxY,main};
}

function makePlan(f,fi,interactive=true){
 autoLayoutIfMissing(f);
 const {scale,minX,maxX,minY,maxY}=geom(f), pad=85, road=70;
 const W=Math.max(560,(maxX-minX)*scale+pad*2),H=Math.max(360,(maxY-minY)*scale+pad*2+road);
 const ox=pad-minX*scale, oy=pad-minY*scale;
 let out=`<svg class="plan-svg" data-fi="${fi}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">
 <rect width="${W}" height="${H}" fill="#fff"/>
 <text x="${W/2}" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">${esc(f.name)}</text>`;
 f.items.forEach((x,ii)=>{
  const cx=ox+(Number(x.ox)||0)*scale, cy=oy+(Number(x.oy)||0)*scale;
  const w=x.w*scale,h=x.d*scale,xp=cx-w/2,yp=cy-h/2;
  out+=`<g class="drag-box" data-fi="${fi}" data-ii="${ii}" transform="translate(${xp} ${yp})" ${interactive?'style="cursor:grab"':''}>
    <rect class="plan-rect" width="${w}" height="${h}" rx="3" fill="${COLORS[x.type]}" stroke="${STROKES[x.type]}" stroke-width="2"/>
    ${w>40?`<line x1="0" y1="-10" x2="${w}" y2="-10" stroke="#374151" stroke-width="1"/>
    <line x1="0" y1="-14" x2="0" y2="-6" stroke="#374151"/><line x1="${w}" y1="-14" x2="${w}" y2="-6" stroke="#374151"/>
    <text x="${w/2}" y="-15" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#111827">${x.w} ม.</text>`:''}
    ${h>40?`<line x1="${w+10}" y1="0" x2="${w+10}" y2="${h}" stroke="#374151" stroke-width="1"/>
    <line x1="${w+6}" y1="0" x2="${w+14}" y2="0" stroke="#374151"/><line x1="${w+6}" y1="${h}" x2="${w+14}" y2="${h}" stroke="#374151"/>
    <text x="${w+15}" y="${h/2}" text-anchor="middle" transform="rotate(90 ${w+15} ${h/2})" font-family="Arial,sans-serif" font-size="10" fill="#111827">${x.d} ม.</text>`:''}
    ${x.name?`<text x="${w/2}" y="${h/2-7}" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700">${esc(x.name)}</text>`:''}
     <text x="${w/2}" y="${h/2+10}" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600">${x.w} × ${x.d} = ${area(x).toFixed(2)} ตร.ม.</text>
    ${interactive?`
      <circle class="resize-handle nw" data-handle="nw" cx="0" cy="0" r="6"/>
      <circle class="resize-handle ne" data-handle="ne" cx="${w}" cy="0" r="6"/>
      <circle class="resize-handle sw" data-handle="sw" cx="0" cy="${h}" r="6"/>
      <circle class="resize-handle se" data-handle="se" cx="${w}" cy="${h}" r="6"/>
    `:''}
  </g>`;
 });
 const roadY=H-road+8;
 out+=`<rect x="0" y="${roadY}" width="${W}" height="${road-8}" fill="#e5e7eb"/>
 <line x1="0" y1="${roadY}" x2="${W}" y2="${roadY}" stroke="#374151" stroke-width="3"/>
 <text x="${W/2}" y="${roadY+38}" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700">ถนน / ด้านหน้าบ้าน</text>
 <path d="M${W/2-10} ${roadY-2} L${W/2+10} ${roadY-2} L${W/2} ${roadY-22} Z" fill="#111827"/>
 <text x="${W/2}" y="${roadY-28}" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">ทางเข้าบ้าน</text>
 </svg>`;
 return out;
}
function autoLayoutIfMissing(f){if(!f.items.some(x=>x.type==='พื้นที่หลัก'))return; if(f.items.some(x=>x.ox===undefined||x.oy===undefined))autoLayout(f)}

function renderPlans(){
 $('plans').innerHTML='';
 floors.forEach((f,fi)=>{
  autoLayoutIfMissing(f);
  const a=f.items.reduce((s,x)=>s+area(x),0);
  const el=document.createElement('div');el.className='card planbox';
  el.innerHTML=`<div class="plan-title"><strong>${esc(f.name)}</strong><span>${a.toFixed(2)} ตร.ม.</span></div>${makePlan(f,fi,true)}`;
  $('plans').appendChild(el);
  enableDrag(el.querySelector('svg'));
 });
 const totals={};floors.forEach(f=>f.items.forEach(x=>totals[x.type]=(totals[x.type]||0)+area(x)));
 const grand=Object.values(totals).reduce((a,b)=>a+b,0);$('grand').textContent=grand.toFixed(2)+' ตร.ม.';
 $('summary').innerHTML=TYPES.filter(t=>totals[t]).map(t=>`<div class="metric" style="background:${COLORS[t]}"><div class="muted">${t}</div><div class="num">${totals[t].toFixed(2)}</div><div class="muted">ตร.ม.</div></div>`).join('');
 const table=$('areaTable'),active=TYPES.filter(t=>totals[t]);
 table.querySelector('thead').innerHTML='<tr><th>รายการ</th>'+floors.map(f=>`<th>${esc(f.name)}</th>`).join('')+'<th>รวม</th></tr>';
 table.querySelector('tbody').innerHTML=active.map(type=>`<tr><td>${type}</td>${floors.map(f=>{const v=f.items.filter(x=>x.type===type).reduce((s,x)=>s+area(x),0);return `<td>${v?v.toFixed(2):'-'}</td>`}).join('')}<td><strong>${totals[type].toFixed(2)}</strong></td></tr>`).join('')
 +`<tr><td><strong>รวมทั้งหมด</strong></td>${floors.map(f=>`<td><strong>${f.items.reduce((s,x)=>s+area(x),0).toFixed(2)}</strong></td>`).join('')}<td><strong>${grand.toFixed(2)}</strong></td></tr>`;
}

function enableDrag(svg){
 if(!svg)return;
 let active=null,pressTimer=null,startX=0,startY=0,startOx=0,startOy=0,startW=0,startD=0;
 const scale=48;
 const toolbar=$('moveToolbar');

 function hideToolbar(){if(toolbar)toolbar.style.display='none'}
 function showToolbar(g,fi,ii){
   if(!toolbar)return;
   toolbar.style.display='flex';
   const r=g.getBoundingClientRect();
   toolbar.style.left=Math.max(8,Math.min(window.innerWidth-250,r.left+r.width/2-120))+'px';
   toolbar.style.top=Math.max(8,r.top-50)+'px';
   toolbar.dataset.fi=fi;toolbar.dataset.ii=ii;
 }
 function point(e){return {x:e.clientX,y:e.clientY}}
 function cancelPress(){if(pressTimer){clearTimeout(pressTimer);pressTimer=null}}

 svg.addEventListener('pointerdown',e=>{
   const handle=e.target.closest('.resize-handle');
   const g=e.target.closest('.drag-box');
   if(!g || (e.pointerType==='mouse' && e.button!==0)) return;
   const fi=+g.dataset.fi,ii=+g.dataset.ii,x=floors[fi].items[ii],p=point(e);
   startX=p.x;startY=p.y;startOx=Number(x.ox)||0;startOy=Number(x.oy)||0;
   startW=Number(x.w)||1;startD=Number(x.d)||1;
   if(handle){
     active={mode:'resize',fi,ii,g,handle:handle.dataset.handle};
     showToolbar(g,fi,ii);e.preventDefault();e.stopPropagation();
     try{g.setPointerCapture?.(e.pointerId)}catch(_){}
     return;
   }
   // Touch: long press enters move mode; mouse starts immediately.
   if(e.pointerType==='mouse'){
     active={mode:'drag',fi,ii,g};showToolbar(g,fi,ii);
     try{g.setPointerCapture?.(e.pointerId)}catch(_){}
     e.preventDefault();
   }else{
     pressTimer=setTimeout(()=>{
       active={mode:'drag',fi,ii,g};g.classList.add('dragging');showToolbar(g,fi,ii);
       try{navigator.vibrate?.(12)}catch(_){}
     },220);
   }
 });

 svg.addEventListener('pointermove',e=>{
   if(!active){
     if(Math.hypot(e.clientX-startX,e.clientY-startY)>8)cancelPress();
     return;
   }
   const x=floors[active.fi].items[active.ii];
   const rect=svg.getBoundingClientRect();
   const dx=(e.clientX-startX)*(svg.viewBox.baseVal.width/rect.width)/scale;
   const dy=(e.clientY-startY)*(svg.viewBox.baseVal.height/rect.height)/scale;
   if(active.mode==='drag'){
     x.ox=startOx+dx;x.oy=startOy+dy;
   }else{
     const h=active.handle,min=.5;
     let nw=startW,nd=startD,nox=startOx,noy=startOy;
     if(h.includes('e'))nw=Math.max(min,startW+dx);
     if(h.includes('w')){nw=Math.max(min,startW-dx);nox=startOx+(startW-nw)/2}
     if(h.includes('s'))nd=Math.max(min,startD+dy);
     if(h.includes('n')){nd=Math.max(min,startD-dy);noy=startOy+(startD-nd)/2}
     x.w=Number(nw.toFixed(2));x.d=Number(nd.toFixed(2));x.ox=Number(nox.toFixed(2));x.oy=Number(noy.toFixed(2));
   }
   e.preventDefault();
   const {minX,minY}=geom(floors[active.fi]),pad=85;
   const cx=pad-minX*scale+x.ox*scale,cy=pad-minY*scale+x.oy*scale;
   const tx=cx-x.w*scale/2,ty=cy-x.d*scale/2;
   active.g.setAttribute('transform',`translate(${tx} ${ty})`);
   const rr=active.g.querySelector('.plan-rect');if(rr){rr.setAttribute('width',x.w*scale);rr.setAttribute('height',x.d*scale)}
   active.g.querySelectorAll('.resize-handle').forEach(h=>{const pos=h.dataset.handle;h.setAttribute('cx',pos.includes('e')?x.w*scale:0);h.setAttribute('cy',pos.includes('s')?x.d*scale:0)});
   showToolbar(active.g,active.fi,active.ii);
 });

 const finish=()=>{cancelPress();if(active){active.g.classList.remove('dragging');renderPlans();active=null}};
 svg.addEventListener('pointerup',finish);svg.addEventListener('pointercancel',finish);
 svg.addEventListener('pointerleave',e=>{if(active&&e.pointerType==='mouse')finish()});
}
document.addEventListener('pointerdown',e=>{
 const b=e.target.closest('#moveToolbar button');if(!b)return;
 const fi=+$('moveToolbar').dataset.fi,ii=+$('moveToolbar').dataset.ii;
 if(!Number.isInteger(fi)||!Number.isInteger(ii)||!floors[fi]?.items[ii])return;
 const x=floors[fi].items[ii],step=.25;
 switch(b.dataset.nudge){
   case'up':x.oy-=step;break;case'down':x.oy+=step;break;case'left':x.ox-=step;break;case'right':x.ox+=step;break;
   case'center':x.ox=0;x.oy=0;break;
 }
 renderPlans();setTimeout(()=>{
   const g=document.querySelector(`.drag-box[data-fi="${fi}"][data-ii="${ii}"]`);
   if(g)showMoveToolbar(g,fi,ii);
 },0);
 e.preventDefault();
});
function showMoveToolbar(g,fi,ii){
 const t=$('moveToolbar');if(!t)return;
 t.style.display='flex';t.dataset.fi=fi;t.dataset.ii=ii;
 const r=g.getBoundingClientRect();
 t.style.left=Math.max(8,Math.min(window.innerWidth-250,r.left+r.width/2-120))+'px';
 t.style.top=Math.max(8,r.top-50)+'px';
}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.drag-box')&&!e.target.closest('#moveToolbar'))$('moveToolbar').style.display='none'});

function getSavedRecords(){
  try{
    const raw=localStorage.getItem('autoBuildingSketchRecords');
    return raw?JSON.parse(raw):[];
  }catch(e){return []}
}
function setSavedRecords(records){
  localStorage.setItem('autoBuildingSketchRecords',JSON.stringify(records));
}
function migrateLegacyRecord(){
  const records=getSavedRecords();
  if(records.length) return records;
  const raw=localStorage.getItem('autoBuildingSketchV2');
  if(!raw) return [];
  try{
    const d=JSON.parse(raw);
    if(!d.cif) return [];
    return [{cif:String(d.cif),propertyType:d.propertyType||'บ้านเดี่ยว',
      otherType:d.otherType||'',floors:d.floors||[],updatedAt:d.updatedAt||new Date().toISOString()}];
  }catch(e){return []}
}
function showNotice(msg){
  $('notice').textContent=msg;
  $('notice').style.display='block';
}
function loadRecord(d){
  const presets=['บ้านเดี่ยว','บ้านแฝด','ทาวน์เฮ้าส์','อาคารพาณิชย์','อาคารสำนักงาน','โรงงาน','โกดัง'];
  if(presets.includes(d.propertyType)){
    $('propertyType').value=d.propertyType;
    $('otherType').value='';
    $('otherTypeWrap').style.display='none';
  }else{
    $('propertyType').value='อื่น ๆ';
    $('otherType').value=d.otherType||d.propertyType||'';
    $('otherTypeWrap').style.display='block';
  }
  floors=JSON.parse(JSON.stringify(d.floors||[]));
  $('cif').value=d.cif||'';
  render();
  $('propertyLabel').textContent='CIF: '+d.cif+'  •  ประเภททรัพย์: '+getPropertyType();
  showNotice('เปิดงาน CIF '+d.cif+' แล้ว');
  $('cifSearchPanel').style.display='none';
}
function renderCifResults(){
  const q=($('cifSearch').value||'').trim();
  const records=migrateLegacyRecord();
  const found=records.filter(r=>!q || String(r.cif).includes(q)).sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
  if(!found.length){
    $('cifResults').innerHTML='<div class="muted" style="padding:10px 0">ไม่พบ CIF ที่บันทึกไว้</div>';
    return;
  }
  $('cifResults').innerHTML=found.map((r,i)=>{
    const dt=new Date(r.updatedAt).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
    return `<button class="btn" data-cif-load="${i}" style="width:100%;text-align:left;margin-top:6px">
      <strong>CIF ${r.cif}</strong><br><span class="muted">${r.propertyType==='อื่น ๆ'?(r.otherType||'อื่น ๆ'):r.propertyType} • แก้ไขล่าสุด ${dt}</span>
    </button>`;
  }).join('');
  [...$('cifResults').querySelectorAll('[data-cif-load]')].forEach((btn)=>{
    btn.onclick=()=>loadRecord(found[Number(btn.dataset.cifLoad)]);
  });
}
$('save').onclick=()=>{
  const cif=($('cif')?.value||'').trim();
  if(!cif){showNotice('กรุณากรอก CIF ก่อนบันทึก');$('cif')?.focus();return}
  let records=migrateLegacyRecord();
  const data={
    cif,
    propertyType:$('propertyType').value,
    otherType:$('otherType')?.value.trim()||'',
    floors:JSON.parse(JSON.stringify(floors)),
    updatedAt:new Date().toISOString()
  };
  const idx=records.findIndex(r=>String(r.cif)===cif);
  if(idx>=0) records[idx]=data; else records.push(data);
  setSavedRecords(records);
  localStorage.setItem('autoBuildingSketchV2',JSON.stringify(data));
  $('propertyLabel').textContent='CIF: '+cif+'  •  ประเภททรัพย์: '+getPropertyType();
  showNotice(idx>=0?'อัปเดตงาน CIF '+cif+' แล้ว':'บันทึกงาน CIF '+cif+' แล้ว');
};

function buildA4Canvas(pageFloors){
 const W=794,H=1123,pad=32,header=62,gap=16,cols=2,rows=2;
 const cellW=(W-pad*2-gap)/2,cellH=500;
 const canvas=document.createElement('canvas'),ratio=2;
 canvas.width=W*ratio;canvas.height=H*ratio;
 const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);
 ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#111827';ctx.font='700 24px Arial,sans-serif';ctx.textAlign='center';
 ctx.fillText('ผังสิ่งปลูกสร้าง',W/2,36);
   ctx.fillStyle='#d8a900';ctx.fillRect(0,0,W,5);
   ctx.fillStyle='#6b7280';ctx.font='13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif';ctx.fillText('ประเภททรัพย์: '+getPropertyType(),W/2,55);
   ctx.textAlign='left';ctx.fillText('CIF: '+(($('cif')?.value||'').trim()||'-'),pad,55);ctx.textAlign='center';
   ctx.textAlign='right';ctx.fillText(new Date().toLocaleDateString('th-TH'),W-pad,55);ctx.textAlign='center';
 ctx.font='12px Arial,sans-serif';ctx.fillStyle='#6b7280';ctx.fillText(getPropertyType(),W/2,53);
 return {canvas,ctx,W,H,pad,header,gap,cols,cellW,cellH};
}
async function drawFloorsToCanvas(canvasInfo,pageFloors){
 const {canvas,ctx,W,H,pad,header,gap,cols,cellW,cellH}=canvasInfo;
 const parsed=pageFloors.map((f,fi)=>{
   const s=makePlan(f,fi,false),doc=new DOMParser().parseFromString(s,'image/svg+xml'),svg=doc.documentElement;
   const vb=svg.getAttribute('viewBox').split(/\s+/).map(Number);
   return {s,w:vb[2],h:vb[3],f};
 });
 for(let i=0;i<parsed.length;i++){
   const r=Math.floor(i/cols),c=i%cols,item=parsed[i],img=new Image();
   img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(item.s);
   await new Promise((res,rej)=>{img.onload=res;img.onerror=rej});
   const scale=Math.min(cellW/item.w,cellH/item.h),dw=item.w*scale,dh=item.h*scale;
   const x=pad+c*(cellW+gap)+(cellW-dw)/2,y=header+r*(cellH+gap)+(cellH-dh)/2;
   ctx.strokeStyle='#d1d5db';ctx.lineWidth=1;
   ctx.strokeRect(pad+c*(cellW+gap),header+r*(cellH+gap),cellW,cellH);
   ctx.drawImage(img,x,y,dw,dh);
 }
 ctx.fillStyle='#6b7280';ctx.font='10px Arial,sans-serif';ctx.textAlign='center';
 ctx.fillText('Auto Building Sketch',W/2,H-16);
 return canvas;
}
$('exportImage').onclick=async()=>{
 try{
   const maxPerPage=4;
   for(let p=0;p<floors.length;p+=maxPerPage){
     const pageFloors=floors.slice(p,p+maxPerPage);
     const info=buildA4Canvas(pageFloors);await drawFloorsToCanvas(info,pageFloors);
     const blob=await new Promise((resolve,reject)=>{
       info.canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG failed')),'image/png');
     });
     // iPhone/iPad Safari may ignore download=. Open the PNG so it can be
     // saved/shared from the native share sheet.
     const url=URL.createObjectURL(blob);
     const win=window.open(url,'_blank');
     if(!win){
       const a=document.createElement('a');a.href=url;a.target='_blank';
       a.rel='noopener';a.textContent='เปิดไฟล์ PNG';
       document.body.appendChild(a);a.click();a.remove();
     }
     setTimeout(()=>URL.revokeObjectURL(url),60000);
   }
 }catch(err){console.error(err);alert('ไม่สามารถ Export รูปภาพได้ กรุณาลองอีกครั้ง');}
};

function makePrintHTML(){
  const pages=[];
  const maxPerPage=4;
  for(let p=0;p<floors.length;p+=maxPerPage){
    const pageFloors=floors.slice(p,p+maxPerPage);
    const info=buildA4Canvas(pageFloors);
    pages.push({canvas:info.canvas, page:p/maxPerPage+1});
  }
  return pages;
}
