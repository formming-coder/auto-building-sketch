<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Building Sketch MVP</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f6f7f9}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:16px;box-shadow:0 2px 8px #00000008}
h1,h2,h3{margin:0 0 8px}.muted{color:#6b7280;font-size:13px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.stack{display:grid;gap:10px}
.floor{border:1px solid #ddd;border-radius:12px;padding:12px}.item{border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin-top:8px}
label{font-size:13px;display:block}input,select{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:9px;margin-top:4px;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:1px solid #cfd3d8;background:white;border-radius:9px;padding:9px 12px;cursor:pointer}.primary{background:#1f2937;color:white;border-color:#1f2937}
.planbox{background:white;border:1px solid #ddd;border-radius:16px;padding:12px;overflow:auto}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border:1px solid #e5e7eb;border-radius:10px;padding:12px}.num{font-size:22px;font-weight:700}
table th,table td{border:1px solid #e5e7eb;padding:8px;text-align:right;white-space:nowrap}
table th:first-child,table td:first-child{text-align:left}
table thead th{background:#f9fafb}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.notice{padding:10px;border-radius:9px;background:#f0fdf4;border:1px solid #bbf7d0;font-size:13px;display:none}
@media(max-width:800px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="row" style="margin-bottom:16px">
    <div><h1>Auto Building Sketch</h1><div class="muted">จากตัวเลขสำรวจ → ผังสิ่งปลูกสร้างอัตโนมัติ</div></div>
    <div class="muted">MVP</div>
  </div>

  <div class="grid">
    <section class="card">
      <h2>ข้อมูลทรัพย์</h2>
      <div class="stack">
        <label>ประเภททรัพย์
          <select id="propertyType">
            <option value="บ้านเดี่ยว">บ้านเดี่ยว</option>
            <option value="บ้านแฝด">บ้านแฝด</option>
            <option value="ทาวน์เฮ้าส์">ทาวน์เฮ้าส์</option>
            <option value="อาคารพาณิชย์">อาคารพาณิชย์</option>
            <option value="อาคารสำนักงาน">อาคารสำนักงาน</option>
            <option value="โรงงาน">โรงงาน</option>
            <option value="โกดัง">โกดัง</option>
            <option value="อื่น ๆ">อื่น ๆ</option>
          </select>
        </label>
        <div id="otherTypeWrap" style="display:none">
          <label>ระบุประเภททรัพย์<input id="otherType" placeholder="พิมพ์ประเภททรัพย์"></label>
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" id="save">บันทึกทรัพย์</button>
        <button class="btn" id="load">โหลดข้อมูล</button>
        <button class="btn" id="clear">เริ่มใหม่</button>
      </div>
      <div id="notice" class="notice"></div>
      <div id="propertyLabel" class="muted" style="margin-top:8px"></div>
      <hr style="border:0;border-top:1px solid #eee;margin:16px 0">

      <div class="row"><h2>ข้อมูลสำรวจ</h2><button class="btn" id="addFloor">+ ชั้น</button></div>
      <div id="editor" class="stack"></div>
      <button class="btn primary" style="width:100%;margin-top:12px" id="generate">สร้างผังอัตโนมัติ</button>

      <hr style="border:0;border-top:1px solid #eee;margin:16px 0">
      <h3>Export</h3>
      <div class="actions">
        <button class="btn" id="exportSvg">Export รูปผัง (SVG)</button>
        <button class="btn" id="print">พิมพ์ / PDF</button>
      </div>
    </section>

    <section class="stack">
      <div class="card">
        <div class="row">
          <div><h2>ผังสิ่งปลูกสร้าง</h2><div class="muted">ด้านล่าง = ทางเข้า / ด้านหน้าเสมอ</div></div>
          <strong id="grand">0.00 ตร.ม.</strong>
        </div>
      </div>
      <div id="plans" class="stack"></div>
      <div class="card">
        <h2>สรุปพื้นที่</h2>
        <div id="summary" class="summary"></div>
        <div style="overflow:auto;margin-top:14px">
          <table id="areaTable" style="width:100%;border-collapse:collapse;font-size:13px">
            <thead></thead><tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
const TYPES=['พื้นที่หลัก','ส่วนต่อเติม','ที่จอดรถ','ระเบียง','เฉลียง','อื่น ๆ'];
let floors=[
 {name:'ชั้น 1',items:[
  {type:'พื้นที่หลัก',name:'ตัวอาคาร',w:5,d:7},
  {type:'ส่วนต่อเติม',name:'ต่อเติมด้านหลัง',w:5,d:2},
  {type:'ที่จอดรถ',name:'ที่จอดรถด้านหน้า',w:5,d:5},
  {type:'เฉลียง',name:'เฉลียงหน้า',w:3,d:2}
 ]},
 {name:'ชั้น 2',items:[
  {type:'พื้นที่หลัก',name:'ตัวอาคาร',w:5,d:6},
  {type:'ส่วนต่อเติม',name:'ต่อเติมด้านหลัง',w:5,d:2},
  {type:'ระเบียง',name:'ระเบียงหน้า',w:3,d:1.5}
 ]}
];

const $=id=>document.getElementById(id);
const area=x=>(Number(x.w)||0)*(Number(x.d)||0);
function getPropertyType(){
  return $('propertyType').value==='อื่น ๆ' ? ($('otherType').value.trim() || 'อื่น ๆ') : $('propertyType').value;
}
$('propertyType').addEventListener('change',()=>{
  $('otherTypeWrap').style.display=$('propertyType').value==='อื่น ๆ'?'block':'none';
});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function renderEditor(){
 $('editor').innerHTML='';
 floors.forEach((f,fi)=>{
  const div=document.createElement('div');div.className='floor';
  div.innerHTML=`<div class="row"><strong>${f.name}</strong>${fi?`<button class="btn" data-act="removeFloor" data-fi="${fi}">ลบชั้น</button>`:''}</div>`;
  f.items.forEach((x,ii)=>{
   const item=document.createElement('div');item.className='item';
   item.innerHTML=`
    <div class="row"><strong>${x.type}</strong><button class="btn" data-act="removeItem" data-fi="${fi}" data-ii="${ii}">ลบ</button></div>
    <label>ชื่อรายการ<input data-k="name" data-fi="${fi}" data-ii="${ii}" value="${esc(x.name)}"></label>
    <label>ประเภท<select data-k="type" data-fi="${fi}" data-ii="${ii}">${TYPES.map(t=>`<option ${t===x.type?'selected':''}>${t}</option>`).join('')}</select></label>
    <div class="two">
      <label>กว้าง (ม.)<input type="number" step="0.1" min="0.1" data-k="w" data-fi="${fi}" data-ii="${ii}" value="${x.w}"></label>
      <label>ลึก (ม.)<input type="number" step="0.1" min="0.1" data-k="d" data-fi="${fi}" data-ii="${ii}" value="${x.d}"></label>
    </div>
    <div class="muted" style="margin-top:6px">พื้นที่ ${area(x).toFixed(2)} ตร.ม.</div>`;
   div.appendChild(item);
  });
  const add=document.createElement('button');add.className='btn';add.style.width='100%';add.style.marginTop='8px';add.textContent='+ เพิ่มพื้นที่';add.dataset.act='addItem';add.dataset.fi=fi;div.appendChild(add);
  $('editor').appendChild(div);
 });
}

function planSvg(f){
 const W=620,H=500,p=65;
 const ordered=[
  ...f.items.filter(x=>x.type==='ส่วนต่อเติม'),
  ...f.items.filter(x=>x.type==='พื้นที่หลัก'),
  ...f.items.filter(x=>x.type==='อื่น ๆ'),
  ...f.items.filter(x=>['ที่จอดรถ','ระเบียง','เฉลียง'].includes(x.type))
 ];
 const maxW=Math.max(...ordered.map(x=>x.w),1), totalD=ordered.reduce((s,x)=>s+x.d,0);
 const s=Math.min((W-2*p)/maxW,(H-115)/Math.max(totalD,1));let y=60;
 let out=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
 <rect width="100%" height="100%" fill="white"/>
 <text x="${W/2}" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">${esc(f.name)}</text>`;
 ordered.forEach(x=>{
  const w=x.w*s,h=x.d*s,xp=(W-w)/2;
  const fill=x.type==='พื้นที่หลัก'?'#e5e7eb':'#f9fafb';
  out+=`<rect x="${xp}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="#111827" stroke-width="2"/>`;
  out+=`<text x="${xp+w/2}" y="${y+h/2-8}" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">${esc(x.type)}</text>`;
  out+=`<text x="${xp+w/2}" y="${y+h/2+10}" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">${esc(x.name)}</text>`;
  out+=`<text x="${xp+w/2}" y="${y+h/2+27}" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">${x.w} × ${x.d} ม. | ${area(x).toFixed(2)} ตร.ม.</text>`;
  y+=h+5;
 });
 out+=`<line x1="110" y1="${y+5}" x2="510" y2="${y+5}" stroke="#111827" stroke-width="2"/>
 <path d="M285 ${y+5} L315 ${y+5} L300 ${y+27} Z" fill="#111827"/>
 <text x="300" y="${y+48}" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">ทางเข้าบ้าน / ด้านหน้า</text></svg>`;
 return out;
}
function renderPlans(){
 $('plans').innerHTML='';
 floors.forEach(f=>{
  const a=f.items.reduce((s,x)=>s+area(x),0);
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`<div class="row"><strong>${esc(f.name)}</strong><span>${a.toFixed(2)} ตร.ม.</span></div><div style="margin-top:8px">${planSvg(f)}</div>`;
  $('plans').appendChild(el);
 });
 const totals={};floors.forEach(f=>f.items.forEach(x=>totals[x.type]=(totals[x.type]||0)+area(x)));
 const grand=Object.values(totals).reduce((a,b)=>a+b,0);$('grand').textContent=grand.toFixed(2)+' ตร.ม.';
 $('summary').innerHTML=TYPES.filter(t=>totals[t]).map(t=>`<div class="metric"><div class="muted">${t}</div><div class="num">${totals[t].toFixed(2)}</div><div class="muted">ตร.ม.</div></div>`).join('');

 const table=$('areaTable');
 const activeTypes=TYPES.filter(t=>totals[t]);
 table.querySelector('thead').innerHTML='<tr><th>รายการ</th>'+floors.map(f=>`<th>${esc(f.name)}</th>`).join('')+'<th>รวม</th></tr>';
 table.querySelector('tbody').innerHTML=activeTypes.map(type=>{
   const cells=floors.map(f=>{
     const v=f.items.filter(x=>x.type===type).reduce((s,x)=>s+area(x),0);
     return `<td>${v? v.toFixed(2):'-'}</td>`;
   }).join('');
   return `<tr><td>${type}</td>${cells}<td><strong>${totals[type].toFixed(2)}</strong></td></tr>`;
 }).join('') + `<tr><td><strong>รวมทั้งหมด</strong></td>${floors.map(f=>`<td><strong>${f.items.reduce((s,x)=>s+area(x),0).toFixed(2)}</strong></td>`).join('')}<td><strong>${grand.toFixed(2)}</strong></td></tr>`;
}
function render(){renderEditor();renderPlans();}
$('editor').addEventListener('input',e=>{
 const fi=e.target.dataset.fi,ii=e.target.dataset.ii,k=e.target.dataset.k;if(fi===undefined)return;
 let v=e.target.value;if(k==='w'||k==='d')v=Math.max(.1,Number(v)||.1);floors[+fi].items[+ii][k]=v;renderPlans();
});
$('editor').addEventListener('click',e=>{
 const a=e.target.dataset.act;if(!a)return;const fi=Number(e.target.dataset.fi);
 if(a==='removeFloor'){floors.splice(fi,1);floors.forEach((f,i)=>f.name='ชั้น '+(i+1));render();}
 if(a==='removeItem'){floors[fi].items.splice(Number(e.target.dataset.ii),1);render();}
 if(a==='addItem'){floors[fi].items.push({type:'ส่วนต่อเติม',name:'รายการใหม่',w:3,d:2});render();}
});
$('addFloor').onclick=()=>{floors.push({name:'ชั้น '+(floors.length+1),items:[{type:'พื้นที่หลัก',name:'ตัวอาคาร',w:5,d:5}]});render();};
$('generate').onclick=render;

$('save').onclick=()=>{
 const data={propertyType:getPropertyType(),floors,updatedAt:new Date().toISOString()};
 localStorage.setItem('autoBuildingSketch',JSON.stringify(data));
 $('propertyLabel').textContent='ประเภททรัพย์: '+getPropertyType();
 $('notice').textContent='บันทึกข้อมูลทรัพย์แล้วในเครื่องนี้';$('notice').style.display='block';
};
$('load').onclick=()=>{
 const raw=localStorage.getItem('autoBuildingSketch');
 if(!raw){$('notice').textContent='ยังไม่มีข้อมูลที่บันทึกไว้';$('notice').style.display='block';return;}
 const d=JSON.parse(raw);
 const savedType=d.propertyType||'บ้านเดี่ยว';
 const presets=['บ้านเดี่ยว','บ้านแฝด','ทาวน์เฮ้าส์','อาคารพาณิชย์','อาคารสำนักงาน','โรงงาน','โกดัง'];
 if(presets.includes(savedType)){$('propertyType').value=savedType;$('otherTypeWrap').style.display='none';}
 else{$('propertyType').value='อื่น ๆ';$('otherType').value=savedType;$('otherTypeWrap').style.display='block';}
 floors=d.floors||floors;render();
 $('propertyLabel').textContent='ประเภททรัพย์: '+getPropertyType();
 $('notice').textContent='โหลดข้อมูลล่าสุดแล้ว';$('notice').style.display='block';
};
$('clear').onclick=()=>{if(confirm('เริ่มข้อมูลใหม่ใช่ไหม?')){floors=[{name:'ชั้น 1',items:[{type:'พื้นที่หลัก',name:'ตัวอาคาร',w:5,d:7}]}];$('propertyType').value='บ้านเดี่ยว';$('otherType').value='';$('otherTypeWrap').style.display='none';render();}};
$('exportSvg').onclick=()=>{
 const svgParts=floors.map(f=>planSvg(f)).join('');
 const blob=new Blob([svgParts],{type:'image/svg+xml;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(getPropertyType()||'building-plan')+'.svg';a.click();URL.revokeObjectURL(a.href);
};
$('print').onclick=()=>window.print();
render();
</script>
</body>
</html>
